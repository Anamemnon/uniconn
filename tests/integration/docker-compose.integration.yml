services:
  openssh:
    build:
      context: ./ssh
      dockerfile: Dockerfile
    container_name: uniconn-test-openssh
    ports:
      - "2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:latest
    container_name: uniconn-test-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=error"
      - "/policies/policy.rego"
    ports:
      - "8181:8181"
    volumes:
      - ./opa/policy.rego:/policies/policy.rego:ro
    healthcheck:
      test:
        [
          "CMD",
          "/opa",
          "eval",
          "--fail",
          'http.send({"method": "GET", "url": "http://127.0.0.1:8181/health"}).status_code == 200',
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  netconf:
    build:
      context: ./mock-servers
      dockerfile: Dockerfile
    container_name: uniconn-test-netconf
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    environment:
      - PYTHONPATH=/workspace/src
    command:
      - "python"
      - "-c"
      - |
        import asyncio, signal
        from uniconn.mock.netconf_server import MockNetconfServer

        async def main():
            srv = MockNetconfServer(host="0.0.0.0", port=8300, username="netconf", password="secret")
            await srv.start()
            stop = asyncio.Event()
            loop = asyncio.get_running_loop()
            for sig in (signal.SIGINT, signal.SIGTERM):
                loop.add_signal_handler(sig, stop.set)
            await stop.wait()
            await srv.stop()

        asyncio.run(main())
    ports:
      - "8300:8300"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.create_connection(('127.0.0.1', 8300), 2); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  gnmi:
    build:
      context: ./mock-servers
      dockerfile: Dockerfile
    container_name: uniconn-test-gnmi
    working_dir: /workspace
    volumes:
      - ../../:/workspace:ro
    environment:
      - PYTHONPATH=/workspace/src
    command:
      - "python"
      - "-c"
      - |
        import asyncio, signal
        from uniconn.mock.gnmi_server import MockGnmiServer

        async def main():
            srv = MockGnmiServer(host="0.0.0.0", port=57400, username="gnmi", password="secret")
            await srv.start()
            stop = asyncio.Event()
            loop = asyncio.get_running_loop()
            for sig in (signal.SIGINT, signal.SIGTERM):
                loop.add_signal_handler(sig, stop.set)
            await stop.wait()
            await srv.stop()

        asyncio.run(main())
    ports:
      - "57400:57400"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.create_connection(('127.0.0.1', 57400), 2); s.close()",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
