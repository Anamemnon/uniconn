[project]
name = "uniconn"
version = "0.2.0"
description = "Universal library for remote command execution"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

# Core dependencies (minimal)
dependencies = [
    "pydantic>=2.0",           # Config validation, SecretStr
    "tenacity>=8.0",           # Retry logic (async support)
]

# Optional dependencies (extras)
[project.optional-dependencies]
ssh = ["asyncssh>=2.13"]
telnet = ["telnetlib3>=2.0"]
serial = ["pyserial-asyncio>=0.6"]
bmc = ["pyghmi>=1.5"]
cli = ["typer>=0.9", "rich>=13.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "pyright>=1.1",
    "ruff>=0.1",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.23",
    "testcontainers>=3.7",     # Docker containers for integration tests
    "pyyaml>=6.0",             # YAML support for from_file()
]

# Entry points for plugin architecture
[project.entry-points."uniconn.transports"]
local = "uniconn.transports._local:LocalTransport"
ssh = "uniconn.transports._ssh:SSHTransport"
telnet = "uniconn.transports._telnet:TelnetTransport"
serial = "uniconn.transports._serial:SerialTransport"
ipmi = "uniconn.transports.bmc._ipmi:IPMITransport"

[project.scripts]
uniconn = "uniconn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["uniconn[dev,cli]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src/uniconn"]
exclude = [".venv", "tests"]
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]