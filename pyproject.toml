[project]
name = "uniconn"
version = "0.16.5"
description = "Universal library for remote command execution"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

# Core lightweight dependencies (SSH, Local execution, resilient pipeline, logging, and config)
dependencies = [
    "pydantic>=2.14",          # Config validation, SecretStr
    "tenacity>=9.2",           # Retry logic (async support)
    "asyncssh>=2.24",          # SSH transport & SFTP
    "structlog>=26.1",         # Structured logging (JSON / Console / ContextVars)
    "pyyaml>=6.0",             # YAML support for from_file(), inventory, and Cassettes
]

# Optional dependencies (extras)
[project.optional-dependencies]
ssh = ["asyncssh>=2.24"]
bmc = ["pyghmi>=1.6", "niquests>=3.10"]
serial = ["pyserial-asyncio>=0.6"]
telnet = ["telnetlib3>=5.0"]
cli = ["cyclopts>=5.0", "rich>=15.0"]
templates = ["jinja2>=3.1"]
otel = ["opentelemetry-api>=1.25"]
all = [
    "uniconn[bmc,serial,telnet,cli,templates]",
]
dev = [
    "uniconn[all,otel]",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "pyright>=1.1.400",
    "ruff>=0.15",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "mkdocs>=1.6",
    "mkdocstrings[python]>=1.0",
    "testcontainers>=4.10",    # Docker containers for integration tests
]

# Entry points for plugin architecture
[project.entry-points."uniconn.transports"]
local = "uniconn.transports._local:LocalTransport"
ssh = "uniconn.transports._ssh:SSHTransport"
telnet = "uniconn.transports._telnet:TelnetTransport"
serial = "uniconn.transports._serial:SerialTransport"
ipmi = "uniconn.transports.bmc._ipmi:IPMITransport"
redfish = "uniconn.transports.bmc._redfish:RedfishTransport"
replay = "uniconn.transports.replay:ReplayTransport"
docker = "uniconn.transports._docker:DockerTransport"
podman = "uniconn.transports._docker:PodmanTransport"
kubectl = "uniconn.transports._kubectl:KubectlTransport"

[project.entry-points.pytest11]
uniconn = "uniconn.pytest_plugin"

[project.scripts]
uniconn = "uniconn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["uniconn[dev]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src", "tests/unit/core"]
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
    "posix_only: marks tests requiring POSIX filesystem or environment capabilities",
    "windows_only: marks tests requiring Windows environment capabilities",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["src/uniconn"]
exclude = [".venv", "tests"]
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "ASYNC", "PIE", "PERF", "RUF"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D213",
    "ASYNC109",
    "ASYNC230",
    "ASYNC240",
    "PERF203",
    "PERF401",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "D", "B007", "B017", "N806", "SIM105", "SIM117"]
"examples/**" = ["E501", "D"]