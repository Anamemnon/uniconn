[project]
name = "uniconn"
version = "0.9.0"
description = "Universal library for remote command execution"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]

# Dependencies (includes all built-in transports and CLI out of the box)
dependencies = [
    "pydantic>=2.14",          # Config validation, SecretStr
    "tenacity>=9.2",           # Retry logic (async support)
    "asyncssh>=2.24",          # SSH transport & SFTP
    "telnetlib3>=5.0",         # Telnet transport
    "pyserial-asyncio>=0.6",   # Serial/UART transport
    "pyghmi>=1.6",             # BMC/IPMI transport
    "cyclopts>=5.0",           # Type-driven CLI interface
    "rich>=15.0",              # CLI formatting
    "pyyaml>=6.0",             # YAML support for from_file() and ScreenPool
    "jinja2>=3.1",             # Template rendering engine
    "structlog>=26.1",         # Structured logging (JSON / Console / ContextVars)
]

# Optional dependencies (extras kept for backward compatibility)
[project.optional-dependencies]
ssh = ["asyncssh>=2.24"]
telnet = ["telnetlib3>=5.0"]
serial = ["pyserial-asyncio>=0.6"]
bmc = ["pyghmi>=1.6"]
cli = ["cyclopts>=5.0", "rich>=15.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.14",
    "pytest-cov>=6.0",
    "pyright>=1.1.400",
    "ruff>=0.15",
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "mkdocs>=1.6",
    "mkdocstrings[python]>=1.0",
    "testcontainers>=4.10",    # Docker containers for integration tests
]

# Entry points for plugin architecture
[project.entry-points."uniconn.transports"]
local = "uniconn.transports._local:LocalTransport"
ssh = "uniconn.transports._ssh:SSHTransport"
telnet = "uniconn.transports._telnet:TelnetTransport"
serial = "uniconn.transports._serial:SerialTransport"
ipmi = "uniconn.transports.bmc._ipmi:IPMITransport"

[project.scripts]
uniconn = "uniconn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["uniconn[dev]"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "src", "tests/unit/core"]
testpaths = ["tests"]
filterwarnings = [
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src/uniconn"]
exclude = [".venv", "tests"]
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D203", "D213"]