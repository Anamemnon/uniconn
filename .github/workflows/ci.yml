name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint and Typecheck
        run: uv run poe check
      - name: Run Unit Tests
        run: uv run pytest -m "not integration and not slow" -q --tb=short
      - name: Core Overhead SLA Check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python -m benchmarks.overhead_bench -n 100 -w 10 --check-thresholds
      - name: Verify Sphinx Documentation Build (Strict -W)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run poe docs-check
      - name: Build and Verify PyPI Distribution Artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          rm -rf dist
          uv build
          uv run python -c "
          import glob, tarfile, zipfile
          forbidden = ('package.json', 'metadata.json', 'main.py', '.claude/', '.cursor/', 'docs/_build/')
          w = sorted(glob.glob('dist/*.whl'))[-1]
          s = sorted(glob.glob('dist/*.tar.gz'))[-1]
          with zipfile.ZipFile(w) as zf:
              whl_bad = [n for n in zf.namelist() if any(f in n for f in forbidden)]
          with tarfile.open(s, 'r:gz') as tf:
              tar_bad = [n for n in tf.getnames() if any(f in n for f in forbidden)]
          assert not whl_bad, f'Forbidden files in wheel: {whl_bad}'
          assert not tar_bad, f'Forbidden files in sdist: {tar_bad}'
          print('Artifacts verified:', w, s)
          "

  integration:
    name: Real Protocol Integration (OpenSSH, OPA, NETCONF, gNMI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Start Real Protocol Stack
        run: docker compose -f tests/integration/docker-compose.integration.yml up -d --build --wait
      - name: Run Real Protocol Integration Tests
        run: uv run pytest tests/integration/test_real_protocols.py -m integration -v --tb=short
      - name: Dump Container Logs on Failure
        if: failure()
        run: |
          docker compose -f tests/integration/docker-compose.integration.yml ps -a
          docker compose -f tests/integration/docker-compose.integration.yml logs --no-color
      - name: Tear Down Real Protocol Stack
        if: always()
        run: docker compose -f tests/integration/docker-compose.integration.yml down -v

